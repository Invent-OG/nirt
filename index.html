    <meta charset="UTF-8" />

    <script>
      (function () {
        try {
          var desc =
            Object.getOwnPropertyDescriptor(window, 'fetch') ||
            Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && desc.configurable) {
            var currentFetch = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              },
            });
          }
        } catch (e) {}

        window.addEventListener(
          'error',
          function (event) {
            if (
              (event &&
                event.filename &&
                event.filename.indexOf('chrome-extension://') === 0) ||
              (event &&
                event.message &&
                event.message.indexOf('Cannot set property fetch') !== -1)
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );
      })();
    </script>
